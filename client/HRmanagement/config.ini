[Server]
; Adresse IP sur laquelle le serveur écoute (0.0.0.0 pour tout écouter ou 127.0.0.1 pour le local uniquement)
host = 127.0.0.1
; Port réseau d'écoute du serveur REST
port = 8080

[Logging]
; Optionnel : Niveau de log (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
; Fichier où écrire les logs du serveur
log_file = server.log
