[Server]
; IP address where the server listens (0.0.0.0 for all interfaces or 127.0.0.1 for local access only).
host = 127.0.0.1
; REST server listening port.
port = 8080

[Database]
; SQLite database file name or path.
db_path = data/employees.db
; Database access timeout in milliseconds (optional but recommended for SQLite).
timeout_ms = 5000

[Logging]
; Optional log level (DEBUG, INFO, WARNING, ERROR).
log_level = INFO
; File where server logs are written.
log_file = server.log