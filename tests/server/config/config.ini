[Server]
; Adresse IP sur laquelle le serveur écoute (0.0.0.0 pour tout écouter ou 127.0.0.1 pour le local uniquement)
host = 127.0.0.1
; Port réseau d'écoute du serveur REST
port = 8080

[Database]
; Nom ou chemin du fichier de la base de données SQLite
db_path = ../data/collaborateurs.db
; Délai d'attente d'accès à la BDD en ms (optionnel mais recommandé en SQLite)
timeout_ms = 5000

[Logging]
; Optionnel : Niveau de log (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
; Fichier où écrire les logs du serveur
log_file = server.log